function label(v,desc=''){ if(String(desc).includes('물품설명 참조')) return '<span class="badge warn">⚠️ 제한적 가능</span>'; if(v===1) return '<span class="badge good">⭕️ 가능</span>'; if(v===0) return '<span class="badge bad">❌ 불가능</span>'; return '<span class="badge info">🔎 확인 필요</span>';}
function textLabel(v){return v===1?'가능':v===0?'불가능':'확인 필요';}
function needsConditional(item){return /국내선|국제선|단|조건|승인|100ml|Wh|리튬|액체|겔|분무|참조|가능\./.test(item.desc||'') || item.sub.includes('제한') || item.sub.includes('조건') || item.cat.includes('액체') || item.name.includes('배터리') || item.name.includes('전자담배');}
function displayLabel(item,kind){let v=kind==='checked'?item.checked:item.cabin; if(needsConditional(item) && v===1) return '<span class="badge warn">⚠️ 제한적 가능</span>'; return label(v);}
function makeSearchBlob(item){return [item.name,item.cat,item.mid,item.sub,item.desc].join(' ');}
function scoreItem(item,q){
  const nq=norm(q); if(!nq) return 0; const name=norm(item.name), blob=norm(makeSearchBlob(item));
  let score=0;
  if(name===nq) score+=1000;
  if(rawNorm(item.name)===rawNorm(q)) score+=850;
  if(name.includes(nq)||nq.includes(name)) score+=520-Math.abs(name.length-nq.length);
  if(blob.includes(nq)) score+=260;
  for(const [cat,names] of Object.entries(CAT)){
    const cn=norm(cat); if(cn.includes(nq)||nq.includes(cn)){ if(norm(item.cat).includes(cn.replace(/\d.*$/,''))) score+=160; }
    for(const alias of names){const an=norm(alias); if(an && (an===nq||an.includes(nq)||nq.includes(an))){ if(norm(item.name).includes(an)||norm(makeSearchBlob(item)).includes(an)||norm(item.cat).includes(cn)) score+=380; } }
  }
  if(item.name.includes('보조배터리') && /배터리|보조|파워뱅크|충전기/.test(q)) score+=300;
  if(item.name.includes('전자담배') && /전자담배|담배|vape|베이프/.test(q.toLowerCase())) score+=350;
  if(item.name.includes('고데기') && /고데기|고대기|헤어/.test(q)) score+=260;
  return score;
}
function search(q,limit=20){ 
  const scored=DATA.map((item,i)=>({item,score:scoreItem(item,q),i})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.i-b.i);
  return scored.slice(0,limit).map(x=>x.item);
}
function parseDesc(desc){
  if(!desc) return '<p>별도 상세 조건이 등록되어 있지 않습니다. 표의 가능 여부를 우선 확인하세요.</p>';
  const d=esc(desc).replace(/\s+/g,' ');
  const k=d.indexOf('[국내선]'), g=d.indexOf('[국제선]');
  if(k>=0 || g>=0){
    let domestic='', intl='';
    if(k>=0 && g>=0){ domestic=d.slice(k+5,g).trim(); intl=d.slice(g+5).trim(); }
    else if(k>=0) domestic=d.slice(k+5).trim();
    else intl=d.slice(g+5).trim();
    return `${domestic?`<h3>🇰🇷 국내선</h3><p>${domestic}</p>`:''}${intl?`<h3>🌐 국제선</h3><p>${intl}</p>`:''}`;
  }
  return `<p>${d}</p>`;
}
function extraNotice(item){
  const n=item.name, cat=item.cat, blob=makeSearchBlob(item);
  let out='';
  if(/보조배터리|리튬이온|여분 리튬|전자담배/.test(blob)){
    out += `<div class="solution"><b>🔋 배터리·전자담배 관리 강화 안내</b><br>
    보조배터리와 전자담배는 위탁수하물로 부칠 수 없으며, 단락방지 조치 후 몸에 지니거나 좌석 앞 주머니에 보관해야 합니다. 기내 선반 보관과 기내 충전은 금지됩니다.</div>`;
  }
  if(cat.includes('액체') || /액체|겔|분무|스프레이|향수|음료|물|젤|크림/.test(blob)){
    out += `<div class="solution"><b>💧 국제선 액체류 안내</b><br>국제선 객실 반입 시 개별 용기에 표기된 용량 기준 100ml 이하, 1인당 1L 이하 투명 지퍼백 1개 조건을 확인하세요.</div>`;
  }
  if(/가위|니퍼|스크루드라이버|렌치|스패너|드릴날/.test(n)){
    out += `<div class="solution"><b>📏 길이 확인 필요</b><br>날 길이 또는 총길이에 따라 기내 휴대 가능 여부가 달라질 수 있습니다. 길이를 확인한 뒤 해당 항목을 선택하세요.</div>`;
  }
  return out;
}
