function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.add('hidden'),3200)}
function badge(v){if(v===1||v==='1'||v==='가능')return '<span class="badge good">⭕ 가능</span>'; if(v===0||v==='0'||v==='불가능')return '<span class="badge bad">❌ 불가능</span>'; return '<span class="badge warn">⚠️ 설명 참조</span>'}
function valLabel(v){if(v===1||v==='1'||v==='가능')return '⭕ 가능'; if(v===0||v==='0'||v==='불가능')return '❌ 불가능'; return '⚠️ 설명 참조'}
function isConditional(r){return !!(r.desc&&/국내선|국제선|100ml|항공사|승인|조건|단|경우|한해|참조/.test(r.desc))}
function decisionBadge(v,r){if(isConditional(r) && (v===1||v==='1')) return '<span class="badge warn">⚠️ 제한적 가능</span>'; return badge(v)}
const aliases={'파워뱅크':'보조배터리','배터리팩':'보조배터리','휴대용충전기':'보조배터리','손선풍기':'휴대용 선풍기','손풍기':'휴대용 선풍기','액상담배':'전자담배','커터':'커터칼','샤프너':'칼갈이','네일니퍼':'네일니퍼','향수병':'향수','물병':'물','생수병':'생수'};
function buildHay(r){return norm([r.name,r.major,r.middle,r.sub,r.desc].join(' '))}
function scoreRecord(r,q){let nq=norm(q), name=norm(r.name), hay=buildHay(r); if(!nq)return 0; if(name===nq)return 100; if(name.replace(/류$/,'')===nq)return 95; if(name.includes(nq)||nq.includes(name))return 82; if(hay.includes(nq))return 64; let ali=aliases[nq]||aliases[q?.trim()]; if(ali&&buildHay(r).includes(norm(ali)))return 88; return 0}
function searchItems(q,limit=10){let query=String(q||'').trim(); if(!query)return []; let exact=DB.map(r=>[r,scoreRecord(r,query)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]); if(exact.length)return exact.slice(0,limit).map(x=>x[0]); let nq=norm(query); let hits=OLD.filter(o=>norm(o.ko).includes(nq)||norm(o.en).includes(nq)).slice(0,3); for(let h of hits){let res=DB.map(r=>[r,scoreRecord(r,h.ko)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]); if(res.length)return res.slice(0,limit).map(x=>x[0]);} return []}
function splitDomesticInternational(desc){desc=String(desc||'').trim(); if(!desc)return ''; let d=desc.replace(/\s+/g,' '); let dk=d.match(/\[국내선\]\s*(.*?)(?=\[국제선\]|$)/); let ik=d.match(/\[국제선\]\s*(.*)$/); if(dk||ik) return `${dk?`<h4>🇰🇷 국내선</h4><p>${esc(dk[1].trim())}</p>`:''}${ik?`<h4>🌐 국제선</h4><p>${esc(ik[1].trim())}</p>`:''}`; return `<p>${esc(d)}</p>`}
function solutionFor(r){let out=[]; if(r.cabin===0) out.push('기내 휴대가 불가능하므로, 위탁 가능 품목이면 카운터에서 부치는 짐으로 옮기세요.'); if(r.checked===0) out.push('위탁 수하물도 불가능한 품목이면 공항 반입 전 제거하거나 항공사·공항 보안검색 담당자에게 확인하세요.'); if(/액체|젤|스프레이|향수|음료|물|크림|치약|김치|고추장/.test([r.major,r.middle,r.name,r.desc].join(' '))) out.push('국제선 객실 반입 액체류는 개별 용기 표기 용량 100ml 이하, 1인당 1L 투명 지퍼백 1개 기준을 확인하세요.'); if(/배터리|전자담배|리튬/.test([r.major,r.middle,r.name,r.desc].join(' '))) out.push('배터리류는 단락방지 조치, Wh·개수 제한, 항공사 승인 필요 여부를 확인하세요.'); if(!out.length) out.push('포장 상태와 실제 재질·크기·용량에 따라 현장 판단이 달라질 수 있으니 의심되는 경우 항공사에 사전 문의하세요.'); return out}
function renderResult(r,query=''){return `<article class="result-card"><div class="result-head"><div><div class="overline">MATCHED ITEM</div><h3>${esc(r.name)}</h3><p class="smalltext muted">${esc(r.major)} › ${esc(r.middle)} › ${esc(r.sub)}</p></div><span class="badge neutral">${query?`검색어: ${esc(query)}`:'기준 데이터'}</span></div><div class="decision"><div><small>🧳 위탁 수하물(카운터에서 부치는 짐)</small><b>${decisionBadge(r.checked,r)}</b></div><div><small>💺 기내 휴대(비행기에 들고 타는 짐)</small><b>${decisionBadge(r.cabin,r)}</b></div></div><h4>📌 상세 안내</h4><div class="detailbox">${splitDomesticInternational(r.desc)||'<p>세부 조건이 별도로 명시되지 않은 항목입니다.</p>'}</div><h4>🛠️ 해결방안</h4><ul class="solution-list">${solutionFor(r).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="notice">${COMMON}</p></article>`}
function homeView(){let cats=[...new Set(DB.map(r=>r.major))]; return `<section class="hero"><div><div class="eyebrow">PHOTO · AI · BAGGAGE DECISION</div><h1>Ready To Boarding</h1><p>물품명을 검색하거나 사진을 촬영하면, 내장 기준 데이터와 대조해 기내 휴대·위탁 수하물 가능 여부와 해결방안을 안내합니다.</p><div class="flow"><span>사진 촬영</span><span>AI 후보 분석</span><span>반입 기준 대조</span><span>해결방안 안내</span></div></div><div class="hero-card"><b>오늘 바로 확인할 수 있는 것</b><p class="smalltext">보조배터리, 전자담배, 액체류, 공구류, 칼류, 의약품, 식품류 등 ${DB.length.toLocaleString()}개 기준 항목을 HTML 내부에 내장했습니다.</p><div class="photo-actions"><button class="btn primary" data-view-shortcut="photo">📷 사진으로 확인</button><button class="btn" data-view-shortcut="search">🔎 물품명 검색</button></div></div></section><div class="grid stats"><div class="card stat"><div class="k">내장 기준 항목</div><div class="v">${DB.length}</div><div class="note">기내·위탁 판정값 포함</div></div><div class="card stat"><div class="k">대분류</div><div class="v">${cats.length}</div><div class="note">위험물·생활용품 등</div></div><div class="card stat"><div class="k">사진 분석</div><div class="v">AI</div><div class="note">Supabase Edge Function 연결</div></div><div class="card stat"><div class="k">배터리 강화 기준</div><div class="v">2025</div><div class="note">보조배터리·전자담배 절차</div></div></div><div class="grid split"><section class="card pad"><h3 class="cardtitle">빠른 확인</h3><div class="quickgrid">${['보조배터리','전자담배','향수','손톱깎이','커터칼','고데기'].map(x=>`<button class="quick" data-quick="${x}"><span>🔎</span><b>${x}</b><small>기내 휴대와 위탁 가능 여부 확인</small></button>`).join('')}</div></section><section class="card pad"><h3 class="cardtitle">운영 원칙</h3><p class="notice">가능/불가능을 단순 안내하지 않고, 제한 조건과 해결방안을 함께 표시합니다. 데이터에 없는 물품은 단정하지 않고 유사 후보 또는 추가 확인으로 안내합니다.</p><p class="smalltext muted">${COMMON}</p></section></div>`}
function searchView(q=''){let results=q?searchItems(q,12):[]; return `<div class="headrow"><div><div class="section-kicker overline">ITEM SEARCH</div><h2>물품명 검색</h2><p>오타·띄어쓰기·일부 동의어를 보정해 기준 데이터 전체를 조회합니다.</p></div></div><section class="card pad"><div class="toolbar"><input id="searchInput" class="input search" placeholder="예: 보조베터리, 향수, 컷터칼, 손풍기" value="${esc(q)}"><button class="btn primary" id="searchBtn">검색</button></div><div id="searchResult">${q?(results.length?results.map(r=>renderResult(r,q)).join(''):`<div class="notice warn">검색 후보를 찾지 못했습니다. 더 구체적인 물품명, 재질, 용량, 배터리 유형을 함께 입력해 주세요.<br>${COMMON}</div>`):'<div class="notice">검색할 물품명을 입력하세요. 예: 보조배터리, 향수, 라이터, 손톱깎이</div>'}</div></section>`}
function batteryView(){return `<div class="headrow"><div><div class="overline">BATTERY & E-CIGARETTE</div><h2>보조배터리·전자담배 강화 절차</h2><p>사진 분석과 검색 결과에 배터리류가 포함되면 아래 기준을 함께 안내합니다.</p></div></div><section class="card pad"><h3 class="cardtitle">🔋 보조배터리 기내 반입 기준</h3><div class="tablewrap"><table class="table"><thead><tr><th>용량</th><th>수량</th><th>항공사 승인</th><th>스티커</th><th>단락방지</th><th>보관 위치</th></tr></thead><tbody><tr><td>100Wh(27,000mAh) 이하</td><td>1~5개</td><td>불필요</td><td>불필요</td><td>필요</td><td>몸에 지니거나 좌석 앞주머니</td></tr><tr><td>100Wh 초과~160Wh 이하</td><td>1~2개</td><td>필요</td><td>필요</td><td>필요</td><td>몸에 지니거나 좌석 앞주머니</td></tr><tr><td>160Wh 초과</td><td colspan="5">반입 불가</td></tr></tbody></table></div><div class="notice bad"><b>공통:</b> 보조배터리와 전자담배는 위탁 수하물로 부칠 수 없습니다. 기내 선반 보관, 기내 충전, 전자담배 사용은 금지됩니다.</div><h3 class="cardtitle">🧯 단락방지 조치</h3><ul class="solution-list"><li>배터리 1개당 비닐봉투 또는 보호 파우치에 분리 보관</li><li>단자에 절연테이프 부착</li><li>단자 보호캡 또는 플러그 부착</li><li>과열·부풀어 오름 발생 시 즉시 승무원에게 알림</li></ul><div class="formgrid"><div class="field"><label>mAh</label><input id="mah" class="input" type="number" placeholder="예: 20000"></div><div class="field"><label>전압(V)</label><input id="volt" class="input" type="number" step="0.1" value="3.7"></div></div><button class="btn primary" id="calcWh" style="margin-top:12px">Wh 계산</button><div id="whResult" class="notice">계산식: Ah × V = Wh</div></section>`}
function batchView(){return `<div class="headrow"><div><div class="overline">BATCH CHECK</div><h2>여러 물품 일괄 확인</h2><p>쉼표 또는 줄바꿈으로 물품을 입력하면 각 항목을 나눠 확인합니다.</p></div></div><section class="card pad"><textarea id="batchInput" placeholder="예: 향수, 보조배터리, 손톱깎이\n커터칼\n전자담배"></textarea><div class="photo-actions"><button class="btn primary" id="batchRun">일괄 확인</button><button class="btn" id="batchSample">샘플 입력</button></div><div id="batchResult" class="batch-list"></div></section>`}
function dataView(){let cats=[...new Set(DB.map(r=>r.major))]; return `<div class="headrow"><div><div class="overline">EMBEDDED DATA</div><h2>내장 데이터 브라우저</h2><p>HTML 내부에 내장된 기준 항목을 확인합니다.</p></div></div><section class="card pad"><div class="data-count">${cats.map(c=>`<span class="badge neutral">${esc(c)} · ${DB.filter(r=>r.major===c).length}</span>`).join('')}</div><div class="toolbar" style="margin-top:16px"><input id="dataFilter" class="input search" placeholder="데이터 필터"></div><div class="tablewrap"><table class="table"><thead><tr><th>물품명</th><th>분류</th><th>위탁</th><th>기내</th><th>설명</th></tr></thead><tbody id="dataRows"></tbody></table></div></section>`}
function settingsView(){return `<div class="headrow"><div><div class="overline">AI CONNECTION</div><h2>AI 연결 설정</h2><p>히든메뉴식 사진 AI 흐름과 동일하게 Supabase Edge Function을 호출합니다.</p></div></div><section class="card pad"><div class="formgrid"><div class="field"><label>Supabase URL</label><input class="input" value="${esc(SUPABASE.url)}" readonly></div><div class="field"><label>Publishable Key</label><input class="input" value="${esc(SUPABASE.key)}" readonly></div><div class="field wide"><label>Edge Function</label><input class="input" value="${AI_FUNCTION}" readonly></div></div><div class="ai-status"><button class="btn primary" id="testAi">AI 서버 상태 확인</button><span id="aiStatus" class="badge neutral">대기</span></div><p class="notice">보안을 위해 Postgres 접속 문자열과 비밀번호는 HTML에 저장하지 않습니다. 사진 분석은 <b>/functions/v1/${AI_FUNCTION}</b> 엔드포인트가 배포되어 있을 때 자동으로 서버 AI를 호출합니다. 서버가 없거나 실패하면 내장 데이터 기반 수동 후보 분석으로 전환됩니다.</p><details><summary class="btn small">Edge Function 요청 형식 보기</summary><pre class="notice" style="white-space:pre-wrap">POST /functions/v1/${AI_FUNCTION}
{ 
  "mode": "analyzePhoto",
  "prompt": "...",
  "images": [{"dataUrl":"data:image/jpeg;base64,...","name":"photo.jpg"}],
  "knownItems": ["보조배터리","향수", "..."]
}</pre></details></section>`}
function photoView(){return `<div class="headrow"><div><div class="overline">HIDDEN MENU STYLE AI</div><h2>사진 AI 분석</h2><p>사진 → AI 후보 분석 → 내장 데이터 대조 → 해결방안 안내 순서로 동작합니다.</p></div></div><section class="chatbox"><div class="chat-head"><div><div class="eyebrow" style="color:#eaf8ff">PHOTO AI</div><h3>Ready To Boarding AI</h3></div><span class="badge good">PHOTO → AI → GUIDE</span></div><div class="chat-feed" id="chatFeed">${chatHtml()}</div><div class="photo-zone"><strong>${state.photos.length?`첨부 사진 ${state.photos.length}장`:'사진을 촬영하거나 업로드하세요'}</strong><p class="smalltext muted">사진만으로 불확실한 물품은 후보로 표시하고, 최종 반입 기준은 내장 데이터와 대조합니다.</p><div class="photo-actions"><label class="btn primary">📷 사진 촬영<input id="photoCamera" type="file" accept="image/*" capture="environment" multiple hidden></label><label class="btn">▧ 앨범에서 선택<input id="photoLibrary" type="file" accept="image/*" multiple hidden></label><button class="btn danger" id="clearPhotos">초기화</button></div><div class="photos">${state.photos.map((p,i)=>`<figure><img src="${p.dataUrl}" alt="첨부 사진 ${i+1}"><button data-remove-photo="${i}">×</button></figure>`).join('')}</div></div><div class="composer"><label class="camera">💬</label><textarea id="photoContext" class="input" rows="1" placeholder="선택: 사진 밖의 정보 입력 예) 국제선, 향수 50ml, 보조배터리 20000mAh">${esc(state.context||'')}</textarea><button class="btn primary" id="analyzePhoto">${state.aiBusy?'분석 중…':'AI 분석 실행'}</button></div></section>${state.lastResults?.length?`<section class="card pad" style="margin-top:14px"><h3 class="cardtitle">판정 결과</h3>${state.lastResults.map(x=>renderResult(x.record,x.query)).join('')}</section>`:''}`}
function chatHtml(){return state.chat.map(m=>`<div class="msg ${esc(m.role)}">${m.role==='assistant'?'<div class="avatar">AI</div>':''}<div class="bubble">${esc(m.text)}</div></div>`).join('')}
function setView(v, opts={}){state.view=v; $$('.navitem,.mobile-dock button').forEach(b=>b.classList.toggle('active',b.dataset.view===v)); let titles={home:'대시보드',search:'물품 검색',photo:'사진 AI 분석',battery:'보조배터리·전자담배',batch:'일괄 확인',data:'내장 데이터',settings:'AI 연결 설정'}; $('#topTitle').textContent=titles[v]||''; document.body.classList.remove('menu-open'); let html=''; if(v==='home')html=homeView(); if(v==='search')html=searchView(opts.q||''); if(v==='photo')html=photoView(); if(v==='battery')html=batteryView(); if(v==='batch')html=batchView(); if(v==='data')html=dataView(); if(v==='settings')html=settingsView(); $('#view').innerHTML=html; bindView(); if(v==='data')renderDataRows(); if(v==='photo')scrollChat();}
function bindView(){let si=$('#searchInput'); if(si){si.addEventListener('keydown',e=>{if(e.key==='Enter')setView('search',{q:si.value})}); $('#searchBtn').onclick=()=>setView('search',{q:si.value})} $$('#view [data-quick]').forEach(b=>b.onclick=()=>setView('search',{q:b.dataset.quick})); $$('[data-view-shortcut]').forEach(b=>b.onclick=()=>setView(b.dataset.viewShortcut)); let calc=$('#calcWh'); if(calc)calc.onclick=()=>{let mah=Number($('#mah').value||0),v=Number($('#volt').value||3.7),wh=mah/1000*v; let text=wh?`계산 결과: 약 ${wh.toFixed(1)}Wh · ${wh<=100?'100Wh 이하':wh<=160?'100Wh 초과~160Wh 이하':'160Wh 초과'}`: 'mAh와 전압을 입력하세요.'; $('#whResult').textContent=text}; let br=$('#batchRun'); if(br)br.onclick=runBatch; let bs=$('#batchSample'); if(bs)bs.onclick=()=>{$('#batchInput').value='향수, 보조배터리, 손톱깎이\n커터칼\n전자담배'}; let df=$('#dataFilter'); if(df)df.oninput=renderDataRows; ['photoCamera','photoLibrary'].forEach(id=>{let inp=$('#'+id); if(inp)inp.onchange=e=>addPhotos(e.target.files)}); let clear=$('#clearPhotos'); if(clear)clear.onclick=()=>{state.photos=[];state.lastResults=[];state.chat=[{role:'assistant',text:'사진을 촬영하거나 업로드하면 분석을 시작합니다.'}];setView('photo')}; $$('[data-remove-photo]').forEach(b=>b.onclick=()=>{state.photos.splice(Number(b.dataset.removePhoto),1);setView('photo')}); let ap=$('#analyzePhoto'); if(ap)ap.onclick=analyzePhoto; let test=$('#testAi'); if(test)test.onclick=testAiStatus;}
function runBatch(){let items=$('#batchInput').value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean); let out=items.map(q=>{let r=searchItems(q,1)[0]; return r?`<div>${renderResult(r,q)}</div>`:`<div class="notice warn"><b>${esc(q)}</b>: 기준 데이터에서 명확한 후보를 찾지 못했습니다. ${COMMON}</div>`}).join(''); $('#batchResult').innerHTML=out||'<div class="notice">확인할 물품을 입력하세요.</div>'}
function renderDataRows(){let q=norm($('#dataFilter')?.value||''); let rows=DB.filter(r=>!q||buildHay(r).includes(q)).slice(0,180); $('#dataRows').innerHTML=rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.major)} › ${esc(r.middle)}</td><td>${badge(r.checked)}</td><td>${badge(r.cabin)}</td><td>${esc((r.desc||'').slice(0,160))}</td></tr>`).join('')}
async function addPhotos(files){for(let f of [...files].slice(0,4-state.photos.length)){let dataUrl=await fileToDataUrl(f); state.photos.push({name:f.name,dataUrl})} state.chat.push({role:'user',text:`사진 ${files.length}장을 첨부했습니다.`}); setView('photo')}
function fileToDataUrl(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function scrollChat(){setTimeout(()=>{let f=$('#chatFeed'); if(f)f.scrollTop=f.scrollHeight},50)}
function buildPhotoPrompt(){let known=DB.map(r=>r.name).slice(0,520).join(', '); return `당신은 국내 출발 항공편 기내반입물품 안내 AI입니다. 사진 속 물품을 식별하고, 아래 knownItems 중 가장 가까운 물품명으로 후보를 반환하세요. 확실하지 않으면 confidence를 낮게 표시하고 unknownReason을 작성하세요. 답변은 JSON만 반환하세요. schema: {"items":[{"name":"물품명","confidence":0.0,"visualEvidence":"사진에서 보이는 근거","unknownReason":""}],"overallNote":""}. knownItems: ${known}. 사용자 추가정보: ${state.context||''}`}
async function callAi(payload){let res=await fetch(`${SUPABASE.url.replace(/\/$/,'')}/functions/v1/${AI_FUNCTION}`,{method:'POST',headers:{apikey:SUPABASE.key,Authorization:`Bearer ${SUPABASE.key}`,'Content-Type':'application/json'},body:JSON.stringify(payload)}); let txt=await res.text(); let data; try{data=JSON.parse(txt)}catch{data={text:txt}} if(!res.ok)throw Error(data.error||data.message||`HTTP ${res.status}`); return data}
function parseAiItems(data){if(Array.isArray(data.items))return data.items; let text=String(data.text||data.answer||data.result||''); let json=text.match(/\{[\s\S]*\}/); if(json)try{let obj=JSON.parse(json[0]); if(Array.isArray(obj.items))return obj.items}catch{} return []}
async function analyzePhoto(){if(state.aiBusy)return; state.context=$('#photoContext')?.value||''; if(!state.photos.length){toast('사진을 먼저 첨부하세요.');return} state.aiBusy=true; state.chat.push({role:'assistant',text:'사진을 분석하고 있습니다. 서버 AI를 호출하고, 결과를 내장 기준 데이터와 대조합니다.'}); setView('photo'); try{let data=await callAi({mode:'analyzePhoto',prompt:buildPhotoPrompt(),images:state.photos.slice(0,4),knownItems:DB.map(r=>r.name)}); let items=parseAiItems(data); if(!items.length&&data.item)items=[{name:data.item,confidence:0.5}]; if(!items.length)throw Error('AI 응답에서 물품 후보를 찾지 못했습니다.'); let resolved=[]; let lines=[]; for(let item of items.slice(0,8)){let q=item.name||item.label||item.object||''; let r=searchItems(q,1)[0]; if(r){resolved.push({query:q,record:r}); lines.push(`• ${q} → ${r.name} / 기내 ${valLabel(r.cabin)} / 위탁 ${valLabel(r.checked)}`)} else lines.push(`• ${q} → 내장 기준 데이터에서 명확한 후보 없음`)} state.lastResults=resolved; state.chat.push({role:'assistant',text:`AI 분석 완료\n${lines.join('\n')}\n\n아래 판정 결과와 해결방안을 확인하세요.`}); toast('사진 AI 분석이 완료되었습니다.')}catch(err){state.chat.push({role:'assistant',text:`AI 서버 연결 또는 분석에 실패했습니다.\n이유: ${err.message}\n\n사진에 보이는 물품명을 채팅창/검색창에 직접 입력하면 내장 데이터 기준으로 즉시 판정할 수 있습니다.`}); toast('AI 분석 실패 · 수동 검색으로 전환하세요.')}finally{state.aiBusy=false; setView('photo')}}
async function testAiStatus(){let s=$('#aiStatus'); s.textContent='확인 중…'; s.className='badge warn'; try{let data=await callAi({mode:'status'}); s.textContent=data.configured===false?'서버 응답 · AI 미설정':'서버 연결 정상'; s.className='badge good'}catch(e){s.textContent='연결 실패'; s.className='badge bad'; toast(e.message)}}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-view]'); if(nav){setView(nav.dataset.view);return}});
$('#openMenu').onclick=()=>document.body.classList.add('menu-open'); $('#closeMenu').onclick=()=>document.body.classList.remove('menu-open'); $('#backdrop').onclick=()=>document.body.classList.remove('menu-open'); $('#printBtn').onclick=()=>window.print();
setView('home');
</script>
</body>
